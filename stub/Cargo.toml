[package]
name = "jpack-stub"
version = "0.1.2"
edition = "2021"
description = "The small native program jpack installs next to a Java app: it starts the app and keeps it up to date."
license = "Apache-2.0"
repository = "https://github.com/B077AS/jpack"
publish = false

[[bin]]
name = "jpack-stub"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Only deflate: every other codec of the zip crate pulls in C code.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Windows uses the TLS that ships with the system (schannel): nothing to compile, and it trusts the same certificates as the
# rest of the machine, which matters behind a company proxy.
[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

# Linux has no TLS library that is the same on every distribution, so the stub carries its own (rustls).
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
